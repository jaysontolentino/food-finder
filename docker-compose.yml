services:
  mysql:
    image: mysql:8.4
    container_name: food-finder-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_finder
      MYSQL_USER: food_finder
      MYSQL_PASSWORD: food_finder
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: